<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sanabi — Python, Data Extraction and Automation</title>
  <desc id="desc">Dark profile banner with a small data pipeline diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111318"/>
      <stop offset="55%" stop-color="#171b22"/>
      <stop offset="100%" stop-color="#101217"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8ff7"/>
      <stop offset="52%" stop-color="#34c38f"/>
      <stop offset="100%" stop-color="#f2b36a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#2b313c"/>

  <g opacity="0.13" stroke="#8b95a7" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
  </g>

  <rect x="64" y="54" width="8" height="156" rx="4" fill="url(#accent)"/>
  <text x="98" y="122" fill="#f4f5f7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="5">SANABI</text>
  <text x="100" y="166" fill="#c4cad4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">PYTHON · DATA EXTRACTION · AUTOMATION</text>
  <text x="100" y="207" fill="#7f8999" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">From messy sources to validated, usable data.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <path d="M725 150H798" stroke="#4f8ff7" stroke-width="3" stroke-linecap="round"/>
    <path d="M887 150H960" stroke="#34c38f" stroke-width="3" stroke-linecap="round"/>
    <path d="M790 143L800 150L790 157" fill="none" stroke="#4f8ff7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M952 143L962 150L952 157" fill="none" stroke="#34c38f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#glow)">
      <rect x="625" y="112" width="102" height="76" rx="14" fill="#18243a" stroke="#4f8ff7"/>
      <rect x="800" y="112" width="89" height="76" rx="14" fill="#173127" stroke="#34c38f"/>
      <rect x="962" y="112" width="112" height="76" rx="14" fill="#35291b" stroke="#f2b36a"/>
    </g>

    <text x="676" y="145" text-anchor="middle" fill="#dce7fb">EXTRACT</text>
    <text x="676" y="166" text-anchor="middle" fill="#7faaf4" font-size="11" font-weight="500">WEB · API · CSV</text>

    <text x="844" y="145" text-anchor="middle" fill="#d9f2e7">VALIDATE</text>
    <text x="844" y="166" text-anchor="middle" fill="#75cba5" font-size="11" font-weight="500">CLEAN · TEST</text>

    <text x="1018" y="145" text-anchor="middle" fill="#f5e8d4">DELIVER</text>
    <text x="1018" y="166" text-anchor="middle" fill="#d9aa67" font-size="11" font-weight="500">CSV · JSON · SQL</text>
  </g>

  <circle cx="1127" cy="55" r="4" fill="#4f8ff7"/>
  <circle cx="1148" cy="55" r="4" fill="#34c38f"/>
  <circle cx="1169" cy="55" r="4" fill="#f2b36a"/>
</svg>
